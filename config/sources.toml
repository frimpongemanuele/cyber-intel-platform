# Source registry. Every outbound fetch must come from here: the SSRF allowlist is
# derived from these URLs (+ explicit extra_hosts for known redirect targets).
#
# trust_tier: primary   = authoritative or original research (advisories, CERTs, vendor
#                         research teams, researcher blogs)
#             secondary = journalism / aggregation (context, never sole evidence)
#
# Facts (KEV status, CVSS, EPSS) only ever come from the structured sources below.
# RSS URLs are verified by the scheduled `network` CI job, not by memory.

[[source]]
name = "cisa-kev"
kind = "kev"
url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
trust_tier = "primary"
poll_minutes = 60
min_interval_seconds = 10

[[source]]
name = "first-epss"
kind = "epss"
url = "https://epss.empiricalsecurity.com/epss_scores-current.csv.gz"
trust_tier = "primary"
poll_minutes = 720
min_interval_seconds = 10

[[source]]
name = "nvd-cve-api"
kind = "nvd"
url = "https://services.nvd.nist.gov/rest/json/cves/2.0"
trust_tier = "primary"
poll_minutes = 120
# 5 requests / rolling 30 s without a key (=6 s); 50 / 30 s with a key (=0.6 s).
# Stay under the limit with margin; the collector lowers this when a key is configured.
min_interval_seconds = 6.5

[[source]]
name = "cve-org-records"
kind = "cve5"
url = "https://cveawg.mitre.org/api/cve/"
trust_tier = "primary"
poll_minutes = 120
min_interval_seconds = 1

[[source]]
name = "mitre-attack-enterprise"
kind = "attack"
url = "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json"
trust_tier = "primary"
poll_minutes = 10080
min_interval_seconds = 10
enabled = false  # STIX parser lands in Phase 7; ~40+ MB file


<!--
  Cyber-intel platform: collection for the Wazuh manager on the same host.
  Installed between markers by detections/wazuh/install.sh; @CIT_DIR@ is replaced with
  the platform directory (default /srv/cit). Wazuh merges this block with the rest of
  ossec.conf. See docs/DETECTIONS.md section 2.
-->
<ossec_config>
  <!-- 1. Platform security events: one JSON object per line, decoded natively -->
  <localfile>
    <log_format>json</log_format>
    <location>@CIT_DIR@/logs/*/security.json</location>
    <label key="cit_source">platform</label>
  </localfile>

  <!-- 2. Every container's stdout/stderr (squid access log, PostgreSQL log, ...).
       Each line is {"log": "...", "stream": "...", "attrs": {"CIT_SERVICE": "..."}, "time": "..."} -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/lib/docker/containers/*/*-json.log</location>
    <label key="cit_source">docker</label>
  </localfile>

  <!-- 3. Kernel log (CIT-WEB-EGRESS firewall lines) already arrives via journald. -->

  <!-- 4. Integrity of secrets and configuration -->
  <syscheck>
    <!-- secrets: alert on any change, but never store their contents (no report_changes) -->
    <directories realtime="yes" check_all="yes" report_changes="no">@CIT_DIR@/deploy/secrets</directories>
    <!-- configuration: keep diffs, they are not sensitive -->
    <directories realtime="yes" check_all="yes" report_changes="yes" recursion_level="0" restrict=".env$|compose.yaml$|compose.override.yaml$">@CIT_DIR@</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">@CIT_DIR@/deploy/squid</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">@CIT_DIR@/deploy/postgres</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">@CIT_DIR@/deploy/scripts</directories>
  </syscheck>

  <!-- 5. Docker events: exec into a container, container create/start/stop, image pulls -->
  <wodle name="docker-listener">
    <disabled>no</disabled>
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
  </wodle>
</ossec_config>

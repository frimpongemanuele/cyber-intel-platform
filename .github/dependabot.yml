# Proposes pin updates as PRs; CI (build, Trivy, compose smoke test) gates every one.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/deploy/squid"
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: "/deploy"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }

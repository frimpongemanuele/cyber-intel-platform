name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token (THREAT_MODEL T15/T17).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # TODO(supply-chain): pin actions to full commit SHAs and let Dependabot bump them.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,net,db]"
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Type-check (mypy --strict)
        run: mypy
      - name: Tests
        run: pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install pip-audit
          python -m pip install -e ".[net,db]"
          pip-audit --skip-editable
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token (THREAT_MODEL T15/T17).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    # Real PostgreSQL for the SQL (psql harness) and repository (psycopg) tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CIT_TEST_PG: "1"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres  # throwaway CI container, not a real secret
    steps:
      # TODO(supply-chain): pin actions to full commit SHAs and let Dependabot bump them.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e ".[dev,net,db]"
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Type-check (mypy --strict)
        run: mypy
      - name: Tests (incl. PostgreSQL)
        run: pytest -ra
      - name: Assert database tests actually ran
        # Guard against silently skipping the DB suites (e.g. a broken env var).
        run: |
          pytest -q tests/test_store_sql.py tests/test_store_db.py -rs | tee /tmp/db.txt
          ! grep -q "skipped" /tmp/db.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install pip-audit
          python -m pip install -e ".[net,db]"
          pip-audit --skip-editable
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: network

# Live checks against real sources (tests/test_network_smoke.py). Kept separate from `ci`
# so third-party outages never block merges, while broken or moved sources still surface.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # weekly, Monday 05:17 UTC

permissions:
  contents: read

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev,net]"
      - name: Live source checks
        run: pytest -m network -v --tb=short -p no:cacheprovider tests/test_network_smoke.py
